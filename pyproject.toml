[project]
name = "wellmanifest-sop"
version = "0.1.0.dev0"
description = "Wellmanifest Standard Operating Procedure (SOP) standard, sync runtime and validation"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.wellmanifest]
standard = "0.19.15"
revision = "efdb30aec5985d49cbf19bb18012524b941ba3ef"
gate = "./project/governance-check.sh"

[tool.pytest.ini_options]
addopts = "-p wellmanifest_governance"
